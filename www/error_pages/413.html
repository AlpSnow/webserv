<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>413 Payload Too Large</title>
	<link rel="icon" href="/favicon.ico" type="image/x-icon">

	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: flex-end;
			justify-content: center;
			padding-bottom: 45px;
			background:
				linear-gradient(rgba(17, 24, 39, 0.30), rgba(17, 24, 39, 0.85)),
				url("/images/413.webp");
			background-size: cover;
			background-position: center;
			background-repeat: no-repeat;
			color: #f9fafb;
			font-family: Arial, Helvetica, sans-serif;
			overflow: hidden;
		}

		.card {
			width: 90%;
			max-width: 760px;
			padding: 34px;
			text-align: center;
			border-radius: 26px;
			background: rgba(17, 24, 39, 0.78);
			border: 1px solid rgba(255, 255, 255, 0.16);
			box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
			animation: pop 0.6s ease-out;
		}

		.code {
			font-size: 90px;
			font-weight: 900;
			line-height: 1;
			letter-spacing: -5px;
			color: #38bdf8;
			text-shadow: 0 0 30px rgba(56, 189, 248, 0.45);
		}

		h1 {
			margin: 10px 0 16px;
			font-size: 32px;
		}

		p {
			margin: 14px auto 0;
			max-width: 560px;
			font-size: 18px;
			line-height: 1.5;
			color: #d1d5db;
		}

		.hint {
			margin-top: 20px;
			padding: 12px 16px;
			border-radius: 14px;
			background: rgba(255, 255, 255, 0.10);
			color: #93c5fd;
			font-family: Consolas, Monaco, monospace;
			font-size: 15px;
		}

		.footer {
			margin-top: 22px;
			font-size: 13px;
			color: #9ca3af;
		}

		@keyframes pop {
			0% {
				transform: scale(0.94);
				opacity: 0;
			}
			100% {
				transform: scale(1);
				opacity: 1;
			}
		}
	</style>
</head>

<body>
	<div class="card">
		<div class="code">413</div>

		<h1>Payload Too Large</h1>

		<p>
			I can't handle this !
		</p>

		<div class="footer">
			Generated by your tiny but stubborn webserv.
		</div>
	</div>
</body>
</html>

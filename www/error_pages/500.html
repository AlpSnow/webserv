<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>500 Internal Server Error</title>
	<style>
		body {
			margin: 0;
			height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #1f2937;
			color: #f9fafb;
			font-family: Arial, sans-serif;
		}
		.card {
			text-align: center;
			max-width: 700px;
			padding: 40px;
			border-radius: 20px;
			background: #111827;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
		}
		.code {
			font-size: 100px;
			font-weight: bold;
			color: #f97316;
		}
		p {
			font-size: 20px;
			color: #d1d5db;
		}
	</style>
</head>
<body>
	<div class="card">
		<div class="code">500</div>
		<h1>Internal Server Error</h1>
		<p>Something exploded inside the server. The bugs are currently pretending they know nothing.</p>
	</div>
</body>
</html>

server
{
    listen 8080;
    server_name localhost webserv.local;

    # 1. FIXED: Point the global root directly to our new www folder
    root www; 
    index index.html;

    client_max_body_size 1000000;


    error_page 403 error_pages/403.html;
    error_page 404 error_pages/404.html;
    error_page 413 error_pages/413.html;
    error_page 500 error_pages/500.html;

    location / {
        methods GET POST;
        root www;
        index index.html;
        autoindex on;
    }

   location /documents {
        methods GET POST HEAD;
        autoindex on;
    }

    location /images {
        methods GET HEAD POST DELETE;
        upload on;
        upload_store www/images;
        autoindex on; 
    }

    
    location /upload {
        methods POST GET;
        root www/upload;
        index index.html;
        client_max_body_size 1000000;
        upload on;
        upload_store www/upload/uploads;
        autoindex off;
    }

    location /old-page {
        methods GET HEAD;
        return 301 /images;
    }

    location /cgi-bin {
        methods GET POST HEAD;
        root www/cgi-bin;
        cgi .php /usr/bin/php-cgi;
        cgi .py /usr/bin/python3;
        cgi .sh /bin/bash;
        autoindex off;
    }
}

server
{
    listen 8083;
    server_name localhost webserv.local;

    root phppendu;
    index index.php;

    client_max_body_size 1000000;

    error_page 400 error_pages/400.html;
    error_page 403 error_pages/403.html;
    error_page 404 error_pages/404.html;
    error_page 405 error_pages/405.html;
    error_page 413 error_pages/413.html;
    error_page 500 error_pages/500.html;

    location / {
        methods GET POST DELETE HEAD;
        root phppendu;
        index index.php;
        cgi .php /usr/bin/php-cgi;
    }

    location /cgi-bin {
        methods GET POST HEAD;

        root www/cgi-bin;

        cgi .py /usr/bin/python3;
        cgi .sh /bin/bash;
        cgi .php /usr/bin/php-cgi;

        autoindex off;
    }
}
 
